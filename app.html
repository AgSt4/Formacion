<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Formación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #F6F4EF;
      color: #1A1916;
      display: flex;
      overflow: hidden;
    }

    /* ===== VARIABLES ===== */
    :root {
      --green: #2D5A3D;
      --green-light: #EBF2ED;
      --amber: #B45C10;
      --amber-light: #FEF3E8;
      --blue: #1A4A7A;
      --blue-light: #EBF2FA;
      --red: #C0392B;
      --red-light: #FDECEC;
      --bg: #F6F4EF;
      --surface: #fff;
      --border: rgba(0,0,0,.1);
      --text-muted: #6B6860;
      --sidebar-bg: #1A1916;
      --sidebar-width: 240px;
    }

    /* ===== LOADING OVERLAY ===== */
    #loadingOverlay {
      position: fixed; inset: 0;
      background: #F6F4EF;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      flex-direction: column; gap: 16px;
    }
    #loadingOverlay .spinner {
      width: 36px; height: 36px;
      border: 3px solid #D1CFC9;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    #loadingOverlay p { color: var(--text-muted); font-size: 14px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform .25s ease;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .sidebar-logo {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      color: #fff;
      letter-spacing: -.3px;
    }

    .sidebar-role {
      font-size: 11px;
      color: rgba(255,255,255,.4);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .sidebar-user {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .sidebar-user-name {
      font-size: 13px;
      color: rgba(255,255,255,.7);
      font-weight: 500;
    }

    .sidebar-user-sede {
      font-size: 11px;
      color: rgba(255,255,255,.35);
      margin-top: 2px;
    }

    .sidebar-nav { padding: 12px 0; flex: 1; }

    .nav-section-label {
      padding: 8px 20px 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(255,255,255,.25);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: rgba(255,255,255,.55);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      transition: background .12s, color .12s;
      border-radius: 0;
      text-decoration: none;
      user-select: none;
    }

    .nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.9); }
    .nav-item.active { background: rgba(255,255,255,.1); color: #fff; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
    .nav-item.active svg { opacity: 1; }

    .sidebar-footer {
      padding: 12px 20px 20px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .btn-logout {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      color: rgba(255,255,255,.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }

    /* ===== MAIN CONTENT ===== */
    #main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      padding: 28px 32px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      color: #1A1916;
      padding-bottom: 20px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      margin-top: 4px;
    }

    .tab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .12s, border-color .12s;
      white-space: nowrap;
    }

    .tab:hover { color: #1A1916; }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }

    .content-area { padding: 28px 32px; flex: 1; }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      color: #1A1916;
      line-height: 1;
    }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      font-weight: 600;
    }

    /* ===== TABLE ===== */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      background: #FAFAF8;
    }

    .data-table td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .data-table tr:last-child td { border-bottom: none; }

    .data-table tr:hover td { background: #FAFAF8; cursor: pointer; }

    /* ===== CHIPS / BADGES ===== */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .chip-green { background: var(--green-light); color: var(--green); }
    .chip-amber { background: var(--amber-light); color: var(--amber); }
    .chip-blue { background: var(--blue-light); color: var(--blue); }
    .chip-red { background: var(--red-light); color: var(--red); }
    .chip-gray { background: #F0EFEB; color: #6B6860; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity .12s, box-shadow .12s;
    }

    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary { background: var(--green); color: #fff; }
    .btn-secondary { background: #F0EFEB; color: #1A1916; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-outline {
      background: transparent;
      color: #1A1916;
      border: 1px solid var(--border);
    }

    .btn svg { width: 14px; height: 14px; }

    /* ===== SEARCH / INPUTS ===== */
    .search-bar {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .search-bar svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="text"], input[type="email"], input[type="date"],
    input[type="number"], select, textarea {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #1A1916;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--surface);
      width: 100%;
      outline: none;
      transition: border-color .12s;
    }

    input[type="text"]:focus, input[type="email"]:focus,
    input[type="date"]:focus, input[type="number"]:focus,
    select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(45,90,61,.08);
    }

    .search-input { padding-left: 32px !important; min-width: 240px; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1A1916;
      margin-bottom: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ===== MODAL ===== */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(26,25,22,.45);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border-radius: 16px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }

    .modal-lg { max-width: 860px; }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    .modal-title {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px; height: 32px;
      background: #F0EFEB;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #6B6860;
      transition: background .12s;
    }

    .modal-close:hover { background: #E5E3DC; }

    .modal-body { padding: 20px 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ===== TOAST ===== */
    #toastContainer {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: #1A1916;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 320px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      animation: slideUp .2s ease;
    }

    .toast-success { border-left: 3px solid #4CAF50; }
    .toast-error { border-left: 3px solid var(--red); }
    .toast-info { border-left: 3px solid var(--blue); }

    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ===== AVATAR ===== */
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .avatar-sm { width: 28px; height: 28px; font-size: 11px; }

    /* ===== PROGRESS BAR ===== */
    .progress-bar {
      height: 6px;
      background: #ECEAE4;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width .3s ease;
    }

    /* ===== STEPPER ===== */
    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .step-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      z-index: 1;
    }

    .step-dot.done { background: var(--green); color: #fff; }
    .step-dot.current { background: var(--amber); color: #fff; }
    .step-dot.pending { background: #ECEAE4; color: #9B9890; }

    .step-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      max-width: 80px;
      line-height: 1.3;
    }

    .step-connector {
      height: 2px;
      flex: 1;
      min-width: 24px;
      background: #ECEAE4;
      margin-bottom: 22px;
    }

    .step-connector.done { background: var(--green); }

    /* ===== KANBAN ===== */
    .kanban-board {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 16px;
      min-height: 400px;
    }

    .kanban-col {
      flex-shrink: 0;
      width: 220px;
      background: #F0EFEB;
      border-radius: 12px;
      padding: 12px;
    }

    .kanban-col-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kanban-col-count {
      background: #DDDBD4;
      color: #6B6860;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }

    .kanban-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow .12s;
    }

    .kanban-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }

    .kanban-card-name { font-size: 13px; font-weight: 500; }
    .kanban-card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ===== ACTIVITY CARDS ===== */
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .12s;
    }

    .activity-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }

    .activity-card-accent {
      height: 4px;
    }

    .activity-card-body { padding: 16px; }
    .activity-card-type { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
    .activity-card-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .activity-card-meta { font-size: 12px; color: var(--text-muted); }

    .activity-card-new {
      background: #FAFAF8;
      border: 2px dashed #D1CFC9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .12s, color .12s;
    }

    .activity-card-new:hover { border-color: var(--green); color: var(--green); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px; height: 48px;
      opacity: .3;
      margin: 0 auto 16px;
      display: block;
    }

    .empty-state h3 { font-size: 15px; color: #1A1916; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    /* ===== SIDEBAR MOBILE ===== */
    #menuToggle {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 150;
      background: var(--sidebar-bg);
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #menuToggle svg { width: 18px; height: 18px; color: #fff; }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        transform: translateX(-100%);
        top: 0; left: 0;
      }
      #sidebar.open { transform: translateX(0); }
      #menuToggle { display: flex; }
      .content-area { padding: 20px 16px; }
      .page-header { padding: 56px 16px 0; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ===== MISC ===== */
    .flex { display: flex; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-center { display: flex; align-items: center; gap: 10px; }
    .gap-2 { gap: 8px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .text-mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); }
    .text-muted { color: var(--text-muted); font-size: 12px; }
    .fw-500 { font-weight: 500; }
    hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* Person name link style */
    .name-link { font-weight: 500; color: #1A1916; }
    .name-link:hover { color: var(--green); }

    /* Inline editable */
    [contenteditable="true"] {
      outline: none;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
    }
    [contenteditable="true"]:focus {
      background: var(--green-light);
      box-shadow: 0 0 0 2px var(--green);
    }

    /* Checkbox style */
    input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--green);
      cursor: pointer;
    }

    /* Stars display */
    .stars { color: #F59E0B; font-size: 14px; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .page-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .1s;
    }
    .page-btn:hover { background: #F0EFEB; }
    .page-btn.active { background: var(--green); color: #fff; border-color: var(--green); }

    .tipo-congreso { background: #F3E8FF; color: #7E22CE; }
    .tipo-curso { background: #EBF2FA; color: #1A4A7A; }
    .tipo-taller { background: #EBF2ED; color: #2D5A3D; }
    .tipo-invitacion { background: #FEF3E8; color: #B45C10; }
    .tipo-mentoria { background: #FEF9EC; color: #92400E; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Cargando sistema...</p>
</div>

<!-- Mobile menu toggle -->
<button id="menuToggle" onclick="toggleSidebar()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">Formación</div>
    <div class="sidebar-role" id="sidebarRole">—</div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-name" id="sidebarName">—</div>
    <div class="sidebar-user-sede" id="sidebarSede">—</div>
  </div>
  <div class="sidebar-nav" id="sidebarNav"><!-- dinámico --></div>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</nav>

<!-- Main -->
<main id="main">
  <div id="appContent"><!-- dinámico según vista activa --></div>
</main>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
// ============================================================
// GLOBAL STATE & INIT
// ============================================================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let CURRENT_USER = null;
let APP_STATE = {
  view: null,
  sedeNombre: '',
  sedes: [],
  rutas: [],
};

// ============================================================
// AUTH
// ============================================================
async function initApp() {
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  // Verificar en tabla usuarios
  const { data: usuario, error } = await db
    .from('usuarios')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !usuario) {
    await db.auth.signOut();
    window.location.href = 'login.html?error=Tu+cuenta+no+está+autorizada.+Contacta+al+administrador.';
    return;
  }

  CURRENT_USER = usuario;

  // Cargar datos globales
  await loadGlobalData();

  // Render UI
  renderSidebar();
  document.getElementById('loadingOverlay').style.display = 'none';

  // Navegar a vista inicial
  if (CURRENT_USER.rol === 'gestor') {
    navigateTo('dashboard');
  } else {
    navigateTo('mi-sede');
  }
}

async function logout() {
  await db.auth.signOut();
  window.location.href = 'login.html';
}

async function loadGlobalData() {
  const [sedesRes, rutasRes] = await Promise.all([
    db.from('sedes').select('*').order('nombre'),
    db.from('rutas').select('*').order('nombre'),
  ]);
  APP_STATE.sedes = sedesRes.data || [];
  APP_STATE.rutas = rutasRes.data || [];

  if (CURRENT_USER.sede_id) {
    const sede = APP_STATE.sedes.find(s => s.id === CURRENT_USER.sede_id);
    APP_STATE.sedeNombre = sede ? sede.nombre : '';
  }
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  document.getElementById('sidebarRole').textContent =
    CURRENT_USER.rol === 'gestor' ? 'Gestor Central' : 'Encargado de Sede';
  document.getElementById('sidebarName').textContent = CURRENT_USER.nombre;
  document.getElementById('sidebarSede').textContent =
    CURRENT_USER.rol === 'gestor' ? 'Todas las sedes' : APP_STATE.sedeNombre;

  const nav = document.getElementById('sidebarNav');

  if (CURRENT_USER.rol === 'gestor') {
    nav.innerHTML = `
      <div class="nav-section-label">General</div>
      <div class="nav-item" data-view="dashboard" onclick="navigateTo('dashboard')">
        ${icoHome()} Dashboard
      </div>
      <div class="nav-item" data-view="directorio" onclick="navigateTo('directorio')">
        ${icoUsers()} Directorio
      </div>
      <div class="nav-item" data-view="rutas" onclick="navigateTo('rutas')">
        ${icoPath()} Rutas Formativas
      </div>
      <div class="nav-section-label">Gestión</div>
      <div class="nav-item" data-view="tareas" onclick="navigateTo('tareas')">
        ${icoCheck()} Tareas por Sede
      </div>
      <div class="nav-item" data-view="duplicados" onclick="navigateTo('duplicados')">
        ${icoCopy()} Duplicados
      </div>
      <div class="nav-section-label">Análisis</div>
      <div class="nav-item" data-view="analytics" onclick="navigateTo('analytics')">
        ${icoChart()} Analytics
      </div>
    `;
  } else {
    nav.innerHTML = `
      <div class="nav-section-label">Mi Sede</div>
      <div class="nav-item" data-view="mi-sede" onclick="navigateTo('mi-sede')">
        ${icoHome()} Mi Sede
      </div>
      <div class="nav-item" data-view="mis-tareas" onclick="navigateTo('mis-tareas')">
        ${icoCheck()} Mis Tareas
      </div>
    `;
  }
}

function setActiveNav(view) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============================================================
// NAVIGATION
// ============================================================
function navigateTo(view) {
  APP_STATE.view = view;
  setActiveNav(view);
  const content = document.getElementById('appContent');
  content.innerHTML = '';

  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }

  switch (view) {
    case 'dashboard': renderDashboard(); break;
    case 'directorio': renderDirectorio(); break;
    case 'rutas': renderRutas(); break;
    case 'tareas': renderTareasGestor(); break;
    case 'duplicados': renderDuplicados(); break;
    case 'analytics': renderAnalytics(); break;
    case 'mi-sede': renderMiSede(); break;
    case 'mis-tareas': renderMisTareas(); break;
    default: content.innerHTML = '<div class="content-area"><p>Vista no encontrada</p></div>';
  }
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ============================================================
// HELPERS
// ============================================================
function initials(nombre, apellido) {
  return ((nombre||'')[0]||'') + ((apellido||'')[0]||'');
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
}

function chipEstado(estado) {
  const map = {
    pendiente: 'chip-amber',
    en_progreso: 'chip-blue',
    completada: 'chip-green',
    atrasada: 'chip-red',
    activo: 'chip-green',
    pausado: 'chip-gray',
  };
  return `<span class="chip ${map[estado]||'chip-gray'}">${estado||'—'}</span>`;
}

function chipTipo(tipo) {
  const map = {
    congreso: 'tipo-congreso',
    curso: 'tipo-curso',
    taller: 'tipo-taller',
    invitacion: 'tipo-invitacion',
    mentoria: 'tipo-mentoria',
  };
  return `<span class="chip ${map[tipo]||'chip-gray'}">${tipo||'—'}</span>`;
}

function accentColor(tipo) {
  const map = { congreso: '#7E22CE', curso: '#1A4A7A', taller: '#2D5A3D', invitacion: '#B45C10', mentoria: '#92400E' };
  return map[tipo] || '#6B6860';
}

async function renderDashboard() {
  document.getElementById('appContent').innerHTML = `
    <div class="page-header">
      <div class="page-title">Dashboard</div>
    </div>
    <div class="content-area" id="dashboardBody">
      <div style="text-align:center;padding:60px 0;color:var(--text-muted)">
        <div class="spinner" style="margin:0 auto 12px"></div>
        Cargando datos...
      </div>
    </div>`;

  // Cargar datos en paralelo
  const [personasRes, actividadesRes, tareasRes, rutasRes, personaRutaRes] = await Promise.all([
    db.from('personas').select('id', { count: 'exact' }),
    db.from('actividades').select('id,sede_id,nombre,tipo,fecha_inicio'),
    db.from('tareas').select('*').neq('estado', 'completada'),
    db.from('rutas').select('*, hitos(*)'),
    db.from('persona_ruta').select('*'),
  ]);

  const totalPersonas = personasRes.count || 0;
  const actividadesAbiertas = (actividadesRes.data || []).length;
  const tareasPendientes = (tareasRes.data || []).length;
  const enRutas = new Set((personaRutaRes.data || []).map(r => r.persona_id)).size;

  const rutas = rutasRes.data || [];
  const prByRuta = {};
  (personaRutaRes.data || []).forEach(pr => {
    if (!prByRuta[pr.ruta_id]) prByRuta[pr.ruta_id] = {};
    const h = pr.hito_actual || 0;
    prByRuta[pr.ruta_id][h] = (prByRuta[pr.ruta_id][h] || 0) + 1;
  });

  document.getElementById('dashboardBody').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Personas</div>
        <div class="stat-value">${totalPersonas}</div>
        <div class="stat-sub">En directorio</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">En Rutas</div>
        <div class="stat-value">${enRutas}</div>
        <div class="stat-sub">Con ruta asignada</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Actividades Abiertas</div>
        <div class="stat-value">${actividadesAbiertas}</div>
        <div class="stat-sub">En todas las sedes</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tareas Pendientes</div>
        <div class="stat-value">${tareasPendientes}</div>
        <div class="stat-sub">Sin completar</div>
      </div>
    </div>

    <div class="card mb-6">
      <div class="card-header">
        <span class="card-title">Rutas Formativas — Distribución por Hito</span>
        <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px" onclick="navigateTo('rutas')">Ver rutas →</button>
      </div>
      <div style="padding:20px">
        ${rutas.length === 0
          ? `<p class="text-muted">No hay rutas creadas aún.</p>`
          : rutas.map(r => {
              const hitos = (r.hitos || []).sort((a,b) => a.orden - b.orden);
              const prs = prByRuta[r.id] || {};
              const total = Object.values(prs).reduce((a,b) => a+b, 0);
              return `
                <div style="margin-bottom:20px">
                  <div style="font-weight:600;margin-bottom:10px;font-size:14px">${r.nombre}
                    <span class="text-muted" style="font-weight:400;margin-left:6px">${total} personas</span>
                  </div>
                  <div class="stepper">
                    ${hitos.map((h, i) => {
                      const cnt = prs[i+1] || 0;
                      const stepClass = cnt > 0 ? 'current' : 'pending';
                      return `
                        ${i > 0 ? `<div class="step-connector"></div>` : ''}
                        <div class="step">
                          <div class="step-dot ${stepClass}" title="${cnt} personas">${cnt}</div>
                          <div class="step-label">${h.nombre}</div>
                        </div>`;
                    }).join('')}
                  </div>
                </div>`;
            }).join('')
        }
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Actividad Reciente</span>
      </div>
      <table class="data-table">
        <thead><tr>
          <th>Actividad</th><th>Tipo</th><th>Sede</th><th>Fecha Inicio</th>
        </tr></thead>
        <tbody>
          ${(actividadesRes.data || []).slice(0,8).map(a => {
            const sede = APP_STATE.sedes.find(s => s.id === a.sede_id);
            return `<tr>
              <td>${a.nombre}</td>
              <td>${chipTipo(a.tipo)}</td>
              <td>${sede ? sede.nombre : '—'}</td>
              <td>${formatDate(a.fecha_inicio)}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:24px">Sin actividades registradas</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

let dirPage = 1;
let dirSearch = '';
let dirFilterSede = '';
let dirFilterRuta = '';
let dirTotal = 0;
const DIR_PAGE_SIZE = 25;

async function renderDirectorio() {
  document.getElementById('appContent').innerHTML = `
    <div class="page-header">
      <div class="flex-between" style="padding-bottom:16px">
        <div class="page-title" style="padding-bottom:0">Directorio Global</div>
        <div class="flex-center gap-2">
          <button class="btn btn-primary" onclick="openPersonaModal(null)">
            ${icoPlus()} Nueva persona
          </button>
        </div>
      </div>
    </div>
    <div class="content-area">
      <div class="flex-between mb-4 gap-2" style="flex-wrap:wrap;gap:10px">
        <div class="search-bar">
          ${icoSearch()}
          <input type="text" class="search-input" placeholder="Buscar por nombre, RUT, email..."
            id="dirSearchInput" oninput="debounceDir()" style="min-width:280px">
        </div>
        <div class="flex-center gap-2">
          <select style="width:160px" id="dirSedeFilter" onchange="changeDirFilter()">
            <option value="">Todas las sedes</option>
            ${APP_STATE.sedes.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('')}
          </select>
          <select style="width:160px" id="dirRutaFilter" onchange="changeDirFilter()">
            <option value="">Todas las rutas</option>
            ${APP_STATE.rutas.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="card" id="dirTable">
        <div style="padding:40px;text-align:center"><div class="spinner" style="margin:0 auto"></div></div>
      </div>
    </div>`;

  dirPage = 1; dirSearch = ''; dirFilterSede = ''; dirFilterRuta = '';
  await loadDirPage();
}

let dirDebounce;
function debounceDir() {
  clearTimeout(dirDebounce);
  dirDebounce = setTimeout(() => {
    dirSearch = document.getElementById('dirSearchInput').value;
    dirPage = 1;
    loadDirPage();
  }, 300);
}

function changeDirFilter() {
  dirFilterSede = document.getElementById('dirSedeFilter').value;
  dirFilterRuta = document.getElementById('dirRutaFilter').value;
  dirPage = 1;
  loadDirPage();
}

async function loadDirPage() {
  const from = (dirPage - 1) * DIR_PAGE_SIZE;
  const to = from + DIR_PAGE_SIZE - 1;

  let query = db.from('personas').select(`
    id, nombre, apellido, rut, email, telefono, genero, carrera, universidad,
    persona_sede(sede_id),
    persona_ruta(ruta_id, hito_actual, estado, rutas(nombre))
  `, { count: 'exact' })
  .order('apellido', { ascending: true })
  .range(from, to);

  if (dirSearch) {
    query = query.or(`nombre.ilike.%${dirSearch}%,apellido.ilike.%${dirSearch}%,rut.ilike.%${dirSearch}%,email.ilike.%${dirSearch}%`);
  }

  const { data, count, error } = await query;
  dirTotal = count || 0;

  const totalPages = Math.ceil(dirTotal / DIR_PAGE_SIZE);
  const personas = data || [];

  // Filter by sede/ruta client-side (simpler with nested data)
  const filtered = personas.filter(p => {
    if (dirFilterSede && !p.persona_sede.some(ps => ps.sede_id === dirFilterSede)) return false;
    if (dirFilterRuta && !p.persona_ruta.some(pr => pr.ruta_id === dirFilterRuta)) return false;
    return true;
  });

  document.getElementById('dirTable').innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Persona</th><th>RUT</th><th>Carrera / Universidad</th>
        <th>Sedes</th><th>Ruta Actual</th><th>Contacto</th>
      </tr></thead>
      <tbody>
        ${filtered.length === 0
          ? `<tr><td colspan="6"><div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <h3>Sin resultados</h3><p>Prueba con otro término de búsqueda</p>
            </div></td></tr>`
          : filtered.map(p => {
            const sedes = (p.persona_sede||[]).map(ps => {
              const s = APP_STATE.sedes.find(x => x.id === ps.sede_id);
              return s ? `<span class="chip chip-gray" style="margin:1px">${s.nombre}</span>` : '';
            }).join('');
            const ruta = (p.persona_ruta||[])[0];
            return `<tr onclick="openFichaPersona('${p.id}')">
              <td>
                <div class="flex-center">
                  <div class="avatar avatar-sm">${initials(p.nombre, p.apellido)}</div>
                  <div>
                    <div class="name-link">${p.nombre} ${p.apellido}</div>
                    <div class="text-muted">${p.email||''}</div>
                  </div>
                </div>
              </td>
              <td><span class="text-mono">${p.rut||'—'}</span></td>
              <td>
                <div style="font-size:13px">${p.carrera||'—'}</div>
                <div class="text-muted">${p.universidad||''}</div>
              </td>
              <td>${sedes||'—'}</td>
              <td>${ruta ? `<div style="font-size:12px">${ruta.rutas?.nombre||''}</div><div style="font-size:11px;color:var(--text-muted)">Hito ${ruta.hito_actual||0}</div>` : '<span class="text-muted">Sin ruta</span>'}</td>
              <td><span class="text-mono">${p.telefono||'—'}</span></td>
            </tr>`;
          }).join('')}
      </tbody>
    </table>
    <div class="pagination">
      <span class="text-muted">${dirTotal} personas</span>
      ${Array.from({length: totalPages}, (_, i) => i+1).slice(Math.max(0, dirPage-3), dirPage+2).map(p =>
        `<button class="page-btn ${p === dirPage ? 'active' : ''}" onclick="dirGoPage(${p})">${p}</button>`
      ).join('')}
    </div>`;
}

function dirGoPage(p) { dirPage = p; loadDirPage(); }

async function openFichaPersona(personaId) {

    *, persona_sede(sede_id, fecha_ingreso),
    persona_ruta(*, rutas(id,nombre), hitos_completados:hito_actual)
  `).eq('id', personaId).single();

  const { data: historial } = await db.from('asistencias').select(`
    *, sesiones(numero, fecha, actividades(nombre, tipo))
  `).eq('persona_id', personaId).order('created_at', { ascending: false }).limit(20);

    *, actividades(nombre)

  for (const pr of (p?.persona_ruta||[])) {
    if (pr.rutas?.id) {
      const { data: hitos } = await db.from('hitos').select('*').eq('ruta_id', pr.rutas.id).order('orden');
      hitosMap[pr.ruta_id] = hitos || [];

  const sedes = (p?.persona_sede||[]).map(ps => {
    const s = APP_STATE.sedes.find(x => x.id === ps.sede_id);
    return s ? s.nombre : ps.sede_id;

  modal.querySelector('.modal-body').innerHTML = `
    <div class="flex-center mb-4">
      <div class="avatar" style="width:48px;height:48px;font-size:16px">${initials(p?.nombre, p?.apellido)}</div>
      <div>
        <div style="font-size:18px;font-weight:600">${p?.nombre} ${p?.apellido}</div>
        <div class="text-muted">${p?.email||''} ${p?.telefono ? '· '+p.telefono : ''}</div>

    </div>

    <div class="tab-bar" style="border-bottom:1px solid var(--border);margin-bottom:16px">
      <div class="tab active" onclick="fichaTab(this,'ficha-datos')">Datos</div>
      <div class="tab" onclick="fichaTab(this,'ficha-rutas')">Rutas</div>
      <div class="tab" onclick="fichaTab(this,'ficha-historial')">Historial</div>
      <div class="tab" onclick="fichaTab(this,'ficha-feedbacks')">Feedbacks</div>
    </div>

    <!-- DATOS -->
    <div id="ficha-datos">
      <div class="form-row" style="margin-bottom:8px">
        <div><span class="form-label">RUT</span><span class="text-mono">${p?.rut||'—'}</span></div>
        <div><span class="form-label">Fecha de Nacimiento</span>${formatDate(p?.fecha_nac)}</div>
        <div><span class="form-label">Género</span>${p?.genero||'—'}</div>
        <div><span class="form-label">Sedes</span>${sedes||'—'}</div>
      </div>
      <hr>
      <div class="form-row" style="margin-bottom:8px">

function fichaTab(el, tabId) {
  el.closest('.modal-body').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['ficha-datos','ficha-rutas','ficha-historial','ficha-feedbacks'].forEach(id => {
    const el2 = document.getElementById(id);
    if (el2) el2.style.display = 'none';
  });
  const target = document.getElementById(tabId);
  if (target) target.style.display = 'block';
}

async function ajustarHito(personaId, rutaId, hitoActual, totalHitos) {
  const nuevo = prompt(`Hito actual: ${hitoActual}. Ingresa el nuevo hito (1-${totalHitos}):`);
  if (!nuevo) return;
  const n = parseInt(nuevo);
  if (isNaN(n) || n < 0 || n > totalHitos) { toast('Número de hito inválido', 'error'); return; }
  const { error } = await db.from('persona_ruta').update({ hito_actual: n, updated_at: new Date() })
    .eq('persona_id', personaId).eq('ruta_id', rutaId);
  if (error) { toast('Error al actualizar hito: ' + error.message, 'error'); return; }
  toast('Hito actualizado');
  document.querySelector('.modal-backdrop')?.remove();
  openFichaPersona(personaId);
}

async function asignarRuta(personaId) {
  if (APP_STATE.rutas.length === 0) { toast('No hay rutas disponibles', 'info'); return; }
  const opts = APP_STATE.rutas.map((r, i) => `${i+1}. ${r.nombre}`).join('\n');
  const sel = prompt(`Selecciona ruta (número):\n${opts}`);
  if (!sel) return;
  const idx = parseInt(sel) - 1;
  if (isNaN(idx) || idx < 0 || idx >= APP_STATE.rutas.length) { toast('Selección inválida', 'error'); return; }
  const ruta = APP_STATE.rutas[idx];
  const { error } = await db.from('persona_ruta').upsert({ persona_id: personaId, ruta_id: ruta.id, hito_actual: 1, estado: 'activo' });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Ruta asignada correctamente');
  document.querySelector('.modal-backdrop')?.remove();
  openFichaPersona(personaId);
}

async function savePersona(personaId) {
  const nombre = document.getElementById('pNombre').value.trim();
  const apellido = document.getElementById('pApellido').value.trim();
  if (!nombre || !apellido) { toast('Nombre y apellido son obligatorios', 'error'); return; }

  const payload = {
    nombre, apellido,
    rut: document.getElementById('pRut').value.trim() || null,
    email: document.getElementById('pEmail').value.trim() || null,
    telefono: document.getElementById('pTelefono').value.trim() || null,
    whatsapp: document.getElementById('pWhatsapp').value.trim() || null,
    fecha_nac: document.getElementById('pFechaNac').value || null,
    genero: document.getElementById('pGenero').value || null,
    colegio: document.getElementById('pColegio').value.trim() || null,
    tipo_colegio: document.getElementById('pTipoColegio').value || null,
    ano_egreso_colegio: document.getElementById('pAnoEgreso').value ? parseInt(document.getElementById('pAnoEgreso').value) : null,
    universidad: document.getElementById('pUniversidad').value.trim() || null,
    carrera: document.getElementById('pCarrera').value.trim() || null,
    generacion: document.getElementById('pGeneracion').value.trim() || null,
    instagram: document.getElementById('pInstagram').value.trim() || null,
    linkedin: document.getElementById('pLinkedin').value.trim() || null,
    sensibilidades: document.getElementById('pSensibilidades').value.trim() || null,
    observaciones: document.getElementById('pObservaciones').value.trim() || null,
    como_llego: document.getElementById('pComoLlego').value.trim() || null,
  };

  let savedId = personaId;
  if (personaId) {
    const { error } = await db.from('personas').update(payload).eq('id', personaId);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
  } else {
    const { data, error } = await db.from('personas').insert(payload).select().single();
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    savedId = data.id;
  }

  // Asignar sede si se seleccionó
  const sedeId = document.getElementById('pSedeAsignar')?.value;
  if (sedeId && savedId) {
    await db.from('persona_sede').upsert({ persona_id: savedId, sede_id: sedeId });
  }

  toast(personaId ? 'Persona actualizada' : 'Persona creada');
  document.querySelector('.modal-backdrop')?.remove();
  if (APP_STATE.view === 'directorio') loadDirPage();
  if (APP_STATE.view === 'mi-sede') renderMiSede();
}

    </div>`;

  await loadRutas();

async function loadRutas() {
  const { data: rutas } = await db.from('rutas').select('*, hitos(*)').order('nombre');
  const { data: prs } = await db.from('persona_ruta').select('ruta_id, hito_actual');

  const countByRutaHito = {};
  (prs||[]).forEach(pr => {
    const key = `${pr.ruta_id}_${pr.hito_actual}`;
    countByRutaHito[key] = (countByRutaHito[key] || 0) + 1;
  });

  document.getElementById('rutasBody').innerHTML = (rutas||[]).length === 0
    ? `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <h3>Sin rutas creadas</h3>
        <p>Crea la primera ruta formativa</p>
      </div>`
    : (rutas||[]).map(r => {
      const hitos = (r.hitos||[]).sort((a,b) => a.orden - b.orden);
      const totalEnRuta = (prs||[]).filter(pr => pr.ruta_id === r.id).length;
      return `
        <div class="card mb-6">
          <div class="card-header">
            <div>
              <span class="card-title">${r.nombre}</span>
              <span class="text-muted" style="margin-left:8px">${r.periodo||''}</span>
            </div>
            <div class="flex-center gap-2">
              <span class="chip chip-blue">${totalEnRuta} personas</span>
            </div>
          </div>
          <div style="padding:20px">
            ${r.descripcion ? `<p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">${r.descripcion}</p>` : ''}
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Hitos (clic para editar nombre):</div>
            <div class="stepper" style="align-items:flex-start">
              ${hitos.map((h, i) => {
                const cnt = countByRutaHito[`${r.id}_${i+1}`] || 0;
                return `
                  ${i > 0 ? `<div class="step-connector"></div>` : ''}
                  <div class="step">
                    <div class="step-dot current">${i+1}</div>
                    <div class="step-label">
                      <span contenteditable="true"
                        onblur="saveHitoNombre('${h.id}', this.textContent)"
                        style="display:block">${h.nombre}</span>
                      <span style="color:var(--green);font-size:10px">${cnt} pers.</span>
                    </div>
                  </div>`;
              }).join('')}
              <div class="step-connector" style="background:transparent"></div>
              <div class="step">
                <div class="step-dot pending" style="cursor:pointer" title="Agregar hito"
                  onclick="addHito('${r.id}', ${hitos.length + 1})">+</div>
                <div class="step-label">Agregar</div>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

  APP_STATE.rutas = rutas || [];
}

async function saveHitoNombre(hitoId, nombre) {
  const n = nombre.trim();
  if (!n) return;
  const { error } = await db.from('hitos').update({ nombre: n }).eq('id', hitoId);
  if (error) toast('Error al guardar: ' + error.message, 'error');
  else toast('Nombre actualizado');
}

async function addHito(rutaId, orden) {
  const nombre = prompt(`Nombre del hito ${orden}:`);
  if (!nombre) return;
  const { error } = await db.from('hitos').insert({ ruta_id: rutaId, orden, nombre: nombre.trim() });
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Hito agregado');
  loadRutas();
}

function openNuevaRutaModal() {
  const modal = createModal();
  modal.querySelector('.modal-title').textContent = 'Nueva Ruta Formativa';
  modal.querySelector('.modal-body').innerHTML = `
    <div class="form-group"><label class="form-label">Nombre *</label>
      <input type="text" id="rNombre" placeholder="Ej: Formación Base"></div>
    <div class="form-group"><label class="form-label">Descripción</label>
      <textarea id="rDesc" rows="2" placeholder="Descripción breve de la ruta"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Período</label>
        <input type="text" id="rPeriodo" placeholder="2025"></div>
    </div>
    <hr>
    <div class="form-label">Hitos (2 a 8) *</div>
    <div id="hitosInputs">
      <div class="form-group"><input type="text" placeholder="Hito 1"></div>
      <div class="form-group"><input type="text" placeholder="Hito 2"></div>
    </div>
    <button class="btn btn-secondary" style="font-size:12px" onclick="addHitoInput()">+ Agregar hito</button>`;

  modal.querySelector('.modal-footer').innerHTML = `
    <button class="btn btn-secondary" onclick="this.closest('.modal-backdrop').remove()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveNuevaRuta()">Crear ruta</button>`;

function addHitoInput() {
  const container = document.getElementById('hitosInputs');
  const n = container.children.length + 1;
  if (n >= 8) { toast('Máximo 8 hitos por ruta', 'info'); return; }
  const div = document.createElement('div');
  div.className = 'form-group';
  div.innerHTML = `<input type="text" placeholder="Hito ${n}">`;
  container.appendChild(div);
}

async function saveNuevaRuta() {
  const nombre = document.getElementById('rNombre').value.trim();
  if (!nombre) { toast('El nombre es obligatorio', 'error'); return; }

  const hitosInputs = [...document.getElementById('hitosInputs').querySelectorAll('input')];
  const hitosNombres = hitosInputs.map(i => i.value.trim()).filter(Boolean);
  if (hitosNombres.length < 2) { toast('Mínimo 2 hitos requeridos', 'error'); return; }

  const { data: ruta, error } = await db.from('rutas').insert({
    nombre,
    descripcion: document.getElementById('rDesc').value.trim() || null,
    periodo: document.getElementById('rPeriodo').value.trim() || null,
  }).select().single();

  if (error) { toast('Error: ' + error.message, 'error'); return; }

  const hitosData = hitosNombres.map((n, i) => ({ ruta_id: ruta.id, orden: i+1, nombre: n }));
  const { error: hErr } = await db.from('hitos').insert(hitosData);
  if (hErr) { toast('Ruta creada pero error en hitos: ' + hErr.message, 'error'); return; }

  toast('Ruta creada exitosamente');
  document.querySelector('.modal-backdrop')?.remove();
  await loadGlobalData();
  loadRutas();
}

}

      <div class="form-group">

        ).join('')}

async function updateTareaGestor(tareaId) {
  const payload = {
    estado: document.getElementById('tEstado').value,
    evaluacion_gestor: document.getElementById('tEvaluacion').value.trim() || null,
  };
  const kpiInput = document.getElementById('tKpiActual');
  if (kpiInput) payload.kpi_actual = parseFloat(kpiInput.value) || 0;

  const { error } = await db.from('tareas').update(payload).eq('id', tareaId);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Tarea actualizada');
  document.querySelector('.modal-backdrop')?.remove();
  loadTareasGestor();
}

function openNuevaTareaModal() {
  const modal = createModal();
  modal.querySelector('.modal-title').textContent = 'Nueva Tarea';
  modal.querySelector('.modal-body').innerHTML = `

async function saveNuevaTarea() {
  const titulo = document.getElementById('ttTitulo').value.trim();
  const sedeId = document.getElementById('ttSede').value;
  if (!titulo || !sedeId) { toast('Título y sede son obligatorios', 'error'); return; }

  const { error } = await db.from('tareas').insert({
    titulo,
    sede_id: sedeId,
    descripcion: document.getElementById('ttDesc').value.trim() || null,
    prioridad: document.getElementById('ttPrioridad').value,
    kpi_nombre: document.getElementById('ttKpiNombre').value.trim() || null,
    kpi_meta: parseFloat(document.getElementById('ttKpiMeta').value) || null,
    fecha_limite: document.getElementById('ttFecha').value || null,
  });

  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Tarea creada');
  document.querySelector('.modal-backdrop')?.remove();
  loadTareasGestor();
}

async function agregarSesion(actividadId, numero) {
  const fecha = prompt(`Fecha para sesión ${numero} (YYYY-MM-DD):`);

  const { error } = await db.from('sesiones').insert({ actividad_id: actividadId, numero, fecha });

async function abrirAsistenciaModal(actividadId, sesionId, numSesion) {

  const { data: ps } = await db.from('personas').select(`
    id, nombre, apellido,

  `).eq('persona_sede.sede_id', CURRENT_USER.sede_id).order('apellido');

  const { data: asistExist } = await db.from('asistencias')
    .select('*').eq('sesion_id', sesionId);

  const asistMap = {};
  (asistExist||[]).forEach(a => { asistMap[a.persona_id] = a; });

  const modal = createModal('lg');
  modal.querySelector('.modal-title').textContent = `Asistencia — Sesión ${numSesion}`;
  modal.querySelector('.modal-body').innerHTML = `
    <div class="flex-between mb-4">
      <span class="text-muted">${(ps||[]).length} personas en sede</span>
      <div class="flex-center gap-2">
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 10px"
          onclick="marcarTodos(true)">Marcar todos</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 10px"
          onclick="marcarTodos(false)">Desmarcar todos</button>

          return `<tr>

                <div class="avatar avatar-sm">${initials(p.nombre, p.apellido)}</div>

function marcarTodos(val) {
  document.querySelectorAll('.asist-check').forEach(el => el.checked = val);
}

async function guardarAsistencia(sesionId) {
  const checks = document.querySelectorAll('.asist-check');
  const notas = document.querySelectorAll('.asist-nota');

  const registros = [...checks].map((el, i) => ({
    sesion_id: sesionId,
    persona_id: el.dataset.pid,
    presente: el.checked,
    nota: notas[i]?.value?.trim() || null,
  }));

  const { error } = await db.from('asistencias').upsert(registros, { onConflict: 'sesion_id,persona_id' });
  if (error) { toast('Error al guardar: ' + error.message, 'error'); return; }
  toast(`Asistencia guardada para ${registros.length} personas`);
  document.querySelector('.modal-backdrop')?.remove();
}

  const rutaId = document.getElementById('aRuta').value;
  const container = document.getElementById('aHitosContainer');

  const { data: hitos } = await db.from('hitos').select('*').eq('ruta_id', rutaId).order('orden');

async function saveNuevaActividad() {
  const nombre = document.getElementById('aNombre').value.trim();
  if (!nombre) { toast('El nombre es obligatorio', 'error'); return; }

  const { data: act, error } = await db.from('actividades').insert({
    sede_id: CURRENT_USER.sede_id,
    nombre,
    tipo: document.getElementById('aTipo').value,
    modalidad: document.getElementById('aModalidad').value,
    fecha_inicio: document.getElementById('aFecha').value || null,
    lugar: document.getElementById('aLugar').value.trim() || null,
    num_sesiones: parseInt(document.getElementById('aNumSes').value) || 1,
    asistencia_minima_pct: parseInt(document.getElementById('aAsistMin').value) || 75,
    forma_aprobacion: document.getElementById('aAprobacion').value.trim() || null,
    descripcion: document.getElementById('aDesc').value.trim() || null,
  }).select().single();

  if (error) { toast('Error: ' + error.message, 'error'); return; }

  // Crear sesiones automáticamente
  const numSes = parseInt(document.getElementById('aNumSes').value) || 1;
  const sesiones = Array.from({length: numSes}, (_, i) => ({
    actividad_id: act.id,
    numero: i + 1,
    fecha: document.getElementById('aFecha').value || null,
  }));
  await db.from('sesiones').insert(sesiones);

  // Vincular hitos
  const selectedHitos = [...document.querySelectorAll('.hito-check:checked')].map(el => ({
    actividad_id: act.id,
    hito_id: el.value,
  }));
  if (selectedHitos.length > 0) {
    await db.from('actividad_hito').insert(selectedHitos);
  }

  toast('Actividad creada exitosamente');
  document.querySelector('.modal-backdrop')?.remove();
  loadSedeActividades();
}

        ${APP_STATE.rutas.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('')}

    <div id="kanbanBoard"></div>`;

async function renderKanban() {
  const rutaId = document.getElementById('kanbanRuta').value;
  const board = document.getElementById('kanbanBoard');
  if (!rutaId) { board.innerHTML = ''; return; }

  const { data: hitos } = await db.from('hitos').select('*').eq('ruta_id', rutaId).order('orden');

  const { data: prs } = await db.from('persona_ruta').select(`
    persona_id, hito_actual, personas(id, nombre, apellido, carrera, colegio)
  `).eq('ruta_id', rutaId);

  // Obtener IDs de personas de esta sede
  const { data: psIds } = await db.from('persona_sede').select('persona_id').eq('sede_id', CURRENT_USER.sede_id);
  const sedeSet = new Set((psIds||[]).map(p => p.persona_id));

  const prsSede = (prs||[]).filter(pr => sedeSet.has(pr.persona_id));

  const byHito = {};
  byHito[0] = [];
  (hitos||[]).forEach(h => { byHito[h.orden] = []; });

  prsSede.forEach(pr => {
    const key = pr.hito_actual || 0;
    if (!byHito[key]) byHito[key] = [];
    byHito[key].push(pr);
  });

  board.innerHTML = `
    <div class="kanban-board">
      <div class="kanban-col">
        <div class="kanban-col-header">
          Sin hito
          <span class="kanban-col-count">${(byHito[0]||[]).length}</span>
        </div>
        ${(byHito[0]||[]).map(pr => kanbanCard(pr)).join('')}
      </div>
      ${(hitos||[]).map(h => `
        <div class="kanban-col">
          <div class="kanban-col-header">
            ${h.nombre}
            <span class="kanban-col-count">${(byHito[h.orden]||[]).length}</span>
          </div>
          ${(byHito[h.orden]||[]).map(pr => kanbanCard(pr)).join('')}
        </div>`).join('')}
    </div>`;
}

function kanbanCard(pr) {
  const p = pr.personas;
  if (!p) return '';
  return `<div class="kanban-card" onclick="openFichaPersona('${p.id}')">
    <div class="flex-center" style="gap:8px">
      <div class="avatar avatar-sm">${initials(p.nombre, p.apellido)}</div>
      <div>
        <div class="kanban-card-name">${p.nombre} ${p.apellido}</div>
        <div class="kanban-card-sub">${p.carrera||p.colegio||'—'}</div>
      </div>
    </div>
  </div>`;
}

async function loadSesionesAsistencia() {
  const actId = document.getElementById('asistActSelect').value;
  const container = document.getElementById('asistSesiones');
  if (!actId) { container.innerHTML = ''; return; }

  const { data: sesiones } = await db.from('sesiones').select('*').eq('actividad_id', actId).order('numero');

  const { data: asistConteo } = await db.from('asistencias')
    .select('sesion_id, presente').in('sesion_id', (sesiones||[]).map(s => s.id));

  const conteoMap = {};
  (asistConteo||[]).forEach(a => {
    if (!conteoMap[a.sesion_id]) conteoMap[a.sesion_id] = { total: 0, presentes: 0 };
    conteoMap[a.sesion_id].total++;
    if (a.presente) conteoMap[a.sesion_id].presentes++;
  });

  container.innerHTML = `
    <div class="card">
      ${(sesiones||[]).length === 0
        ? `<div class="empty-state"><p>Sin sesiones para esta actividad</p></div>`
        : `<table class="data-table">
          <thead><tr><th>Sesión</th><th>Fecha</th><th>Registros</th><th>Presentes</th><th></th></tr></thead>
          <tbody>
            ${(sesiones||[]).map(s => {
              const c = conteoMap[s.id] || { total: 0, presentes: 0 };
              const pct = c.total > 0 ? Math.round(c.presentes / c.total * 100) : 0;
              return `<tr>
                <td><strong>Sesión ${s.numero}</strong></td>
                <td>${formatDate(s.fecha)}</td>
                <td>${c.total}</td>
                <td>
                  <div class="flex-center gap-2">
                    <div class="progress-bar" style="width:80px"><div class="progress-fill" style="width:${pct}%"></div></div>
                    <span style="font-size:12px">${c.presentes} (${pct}%)</span>
                  </div>
                </td>
                <td>
                  <button class="btn btn-primary" style="font-size:12px;padding:5px 10px"
                    onclick="abrirAsistenciaModal('${actId}','${s.id}',${s.numero})">
                    Tomar asistencia
                  </button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`}
    </div>`;
}

// --- Pestaña Estadísticas ---
async function loadSedeEstadisticas() {
  const [psRes, asistRes, prRes] = await Promise.all([
    db.from('persona_sede').select('persona_id', { count: 'exact' }).eq('sede_id', CURRENT_USER.sede_id),
    db.from('asistencias').select('presente', { count: 'exact' }),
    db.from('persona_ruta').select('*'),
  ]);

  const { data: personas } = await db.from('personas').select('genero, tipo_colegio')
    .in('id', (psRes.data||[]).map(p => p.persona_id));

  const total = psRes.count || 0;
  const totalAsist = asistRes.count || 0;
  const presentes = (asistRes.data||[]).filter(a => a.presente).length;
  const tasa = totalAsist > 0 ? Math.round(presentes / totalAsist * 100) : 0;
  const pctMujeres = total > 0 ? Math.round((personas||[]).filter(p => p.genero === 'femenino').length / total * 100) : 0;

  document.getElementById('sedeContent').innerHTML = `
    <div class="stats-grid mb-6">
      <div class="stat-card"><div class="stat-label">Personas en sede</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Asistencias registradas</div><div class="stat-value">${totalAsist}</div></div>
      <div class="stat-card"><div class="stat-label">Tasa de presencia</div><div class="stat-value">${tasa}%</div></div>
      <div class="stat-card"><div class="stat-label">% Mujeres</div><div class="stat-value">${pctMujeres}%</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Tipo de Colegio</span></div>
        <div style="padding:20px">
          ${['municipal','part.subv','part.pagado'].map(tc => {
            const cnt = (personas||[]).filter(p => p.tipo_colegio === tc).length;
            const pct = total > 0 ? Math.round(cnt / total * 100) : 0;
            return `<div style="margin-bottom:12px">
              <div class="flex-between mb-4"><span style="font-size:13px">${tc}</span><span class="text-muted">${cnt} (${pct}%)</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Género</span></div>
        <div style="padding:20px">
          ${['masculino','femenino','otro'].map(g => {
            const cnt = (personas||[]).filter(p => p.genero === g).length;
            const pct = total > 0 ? Math.round(cnt / total * 100) : 0;
            return `<div style="margin-bottom:12px">
              <div class="flex-between mb-4"><span style="font-size:13px;text-transform:capitalize">${g}</span><span class="text-muted">${cnt} (${pct}%)</span></div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

              <div class="form-group">
                <div class="flex-between" style="margin-bottom:4px">
                  <span style="font-size:12px;font-weight:600">${t.kpi_nombre}</span>
                  <span class="text-muted">${t.kpi_actual||0} / ${t.kpi_meta||0}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              </div>` : ''}
            <div class="flex-between" style="margin-top:8px">
              <span class="text-muted">Vence: ${formatDate(t.fecha_limite)}</span>
              <button class="btn btn-primary" style="font-size:12px;padding:5px 12px"
                onclick="openResponderTarea('${t.id}')">Responder</button>
            </div>
            ${t.evaluacion_gestor ? `
              <div style="background:var(--green-light);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px">
                <strong>Evaluación del gestor:</strong> ${t.evaluacion_gestor}
              </div>` : ''}
          </div>
        </div>`;
      }).join('')}`;
}

async function openResponderTarea(tareaId) {
  const { data: t } = await db.from('tareas').select('*').eq('id', tareaId).single();
  const modal = createModal();
  modal.querySelector('.modal-title').textContent = 'Responder Tarea';
  modal.querySelector('.modal-body').innerHTML = `
    <p style="font-size:14px;font-weight:500;margin-bottom:12px">${t.titulo}</p>
    ${t.kpi_nombre ? `
      <div class="form-group">
        <label class="form-label">Actualizar KPI: ${t.kpi_nombre} (meta: ${t.kpi_meta})</label>
        <input type="number" id="rtKpi" value="${t.kpi_actual||0}" step="0.1">
      </div>` : ''}
    <div class="form-group">
      <label class="form-label">Estado</label>
      <select id="rtEstado">
        ${['pendiente','en_progreso','completada'].map(s =>
          `<option value="${s}" ${t.estado===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Respuesta / Comentario</label>
      <textarea id="rtRespuesta" rows="4" placeholder="Describe el avance, acciones tomadas...">${t.respuesta_sede||''}</textarea>
    </div>`;

  modal.querySelector('.modal-footer').innerHTML = `
    <button class="btn btn-secondary" onclick="this.closest('.modal-backdrop').remove()">Cancelar</button>
    <button class="btn btn-primary" onclick="enviarRespuesta('${tareaId}')">Enviar respuesta</button>`;
  document.body.appendChild(modal);
}

async function enviarRespuesta(tareaId) {
  const payload = {
    estado: document.getElementById('rtEstado').value,
    respuesta_sede: document.getElementById('rtRespuesta').value.trim() || null,
  };
  const kpiInput = document.getElementById('rtKpi');
  if (kpiInput) payload.kpi_actual = parseFloat(kpiInput.value) || 0;

  const { error } = await db.from('tareas').update(payload).eq('id', tareaId);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Respuesta enviada');
  document.querySelector('.modal-backdrop')?.remove();
  renderMisTareas();
}

// ============================================================
// MODAL HELPER
// ============================================================
function createModal(size) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });

  const modal = document.createElement('div');
  modal.className = `modal ${size === 'lg' ? 'modal-lg' : ''}`;

  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">Modal</div>
      <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">✕</button>
    </div>
    <div class="modal-body"></div>
    <div class="modal-footer"></div>`;

  backdrop.appendChild(modal);
  return backdrop;
}

// ============================================================
// START
// ============================================================
initApp();
</script>
